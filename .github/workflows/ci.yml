# Continuous integration (Phase 8): lint, type-check, unit tests, build, integration tests against
# real PostgreSQL and Redis, and a build of the three production images (not pushed anywhere).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: acra_ci
          POSTGRES_PASSWORD: acra_ci_password
          POSTGRES_DB: acra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acra_ci -d acra" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # CI-only throwaway credentials for the service containers above.
      DATABASE_URL: postgresql://acra_ci:acra_ci_password@127.0.0.1:5432/acra?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      # 32 bytes of "ci-only-not-a-secret-key-0000001" (public on purpose; CI data is thrown away).
      CREDENTIALS_MASTER_KEY: Y2ktb25seS1ub3QtYS1zZWNyZXQta2V5LTAwMDAwMDE=
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm db:migrate
      - run: pnpm test:integration

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: check
    strategy:
      matrix:
        include:
          - { name: api, file: infrastructure/docker/node-app.Dockerfile, args: 'APP=api', target: runtime }
          - { name: worker, file: infrastructure/docker/node-app.Dockerfile, args: 'APP=worker', target: runtime }
          - { name: migrate, file: infrastructure/docker/node-app.Dockerfile, args: 'APP=api', target: migrate }
          - { name: dashboard, file: infrastructure/docker/dashboard.Dockerfile, args: '', target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.args }}
          push: false
          tags: acra-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
